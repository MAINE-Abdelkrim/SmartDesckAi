[tool.poetry]
name = "smartdesk-ai"
version = "0.1.0"
description = "Intelligent Customer Support & Ticket Management Platform"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.111.0"
uvicorn = "^0.30.0"
pydantic = "^2.7"
sqlalchemy = "^2.0"
alembic = "^1.13"
psycopg2-binary = "^2.9"
python-jose = "^3.3"
passlib = "^1.7"
# ML packages
pandas = "^2.2"
numpy = "^2.0"
scikit-learn = "^1.5"
joblib = "^1.4"
# MLOps
mlflow = "^2.11"
dvc = "^3.54"
# Optional
spacy = "^3.7"

[tool.poetry.dev-dependencies]
ruff = "^0.6"
black = "^24.3"
pytest = "^8.2"
pytest-asyncio = "^0.23"
# Frontend tooling not needed here

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
''' 

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "I", "B", "UP"]
ignore = []
exclude = [".git", "__pycache__", "build", "dist"]

[tool.pytest.ini_options]
addopts = "-ra -q"
